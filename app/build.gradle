plugins { id 'com.android.application' }
android {
    namespace 'com.bitvaultengine.retrocollection'
    compileSdk 34
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.bitvaultengine.retrocollection.preview'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("AKG_VERSION_CODE") ?: "2")
        versionName '0.0.2-player-preview'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { } }
    }
    if (System.getenv("AKG_RELEASE_KEYSTORE")) {
        signingConfigs {
            production {
                storeFile file(System.getenv("AKG_RELEASE_KEYSTORE"))
                storePassword System.getenv("AKG_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("AKG_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("AKG_RELEASE_KEY_PASSWORD")
            }
        }
        buildTypes { release { signingConfig signingConfigs.production; minifyEnabled false } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'net.i2p.crypto:eddsa:0.3.0' }
