name: Build and smoke-test Android playable preview
on:
  push:
    branches: [main]
    paths: ['updates/version.json', 'updates/public-key.json', 'scripts/build_signed_apk.py', 'app/**', 'build.gradle', 'settings.gradle', 'gradle/**', 'gradlew', 'scripts/package_roms.py', 'scripts/android_emulator_smoke.sh', 'engine-reference.json', '.github/workflows/android-playable.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: midoali250/bitvault-engine
          ref: dd10789e048871746d6a09809c55221b92e1f403
          path: engine-source
          sparse-checkout: |
            engine/android
            engine/cores/registry.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK and CMake
        run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Install shared Android frontend
        run: |
          mkdir -p app/src/main/cpp app/src/main/java/com/bitvaultengine/retrocollection
          cp engine-source/engine/android/{libretro_bridge.c,CMakeLists.txt} app/src/main/cpp/
          cp engine-source/engine/android/{NativeBridge.java,PlayerActivity.java} app/src/main/java/com/bitvaultengine/retrocollection/
      - name: Build pinned NES and SNES cores for Android
        run: python3 engine-source/engine/android/build_cores.py
      - name: Download and verify user's games
        run: |
          python3 scripts/package_roms.py
          mkdir -p app/src/main/assets/roms app/src/main/assets/cheats
          cp package-roms/* app/src/main/assets/roms/
          cp cheats/index.json app/src/main/assets/cheats/index.json
          mkdir -p app/src/main/assets/updates
          cp updates/public-key.json app/src/main/assets/updates/public-key.json
      - name: Build experimental debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Build dedicated signed APK and signed upgrade test
        env:
          AKG_ANDROID_RELEASE_SIGNING_JSON: ${{ secrets.AKG_ANDROID_RELEASE_SIGNING_JSON }}
        run: python scripts/build_signed_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-review-apk
          path: ci-signed/*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-upgrade-test
          path: ci-signed-test/*.apk
          retention-days: 1
          if-no-files-found: error
      - name: Verify APK contains the Android update public key
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)
          test -n "$APK"
          unzip -p "$APK" assets/updates/public-key.json | cmp - updates/public-key.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-playable-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
  emulator-smoke:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-playable-debug-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: android-signed-review-apk
          path: signed-apk
      - uses: actions/download-artifact@v4
        with:
          name: android-signed-upgrade-test
          path: signed-apk-test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Test NES and SNES on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android_emulator_smoke.sh
